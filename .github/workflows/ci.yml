name: check

# Architecture enforced BEFORE code moves (IP-unified-architecture.md, Phase 2).
#
# Every gate here has been shown to FAIL on a planted violation, not merely to
# pass on clean code. A check that has never been seen to fail is not known to
# work — which is the same reason Phase 4's referential-transparency test must be
# present and failing before the fix lands.
#
# Scope is packages/ only. src/script.js, tools/ and scripts/ are
# pre-migration and join as Phase 8 extracts from them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # THE ONE CHAIN. `npm run check` in package.json is the single list of
      # gates; CI runs that list, never its own copy (plan 13 A3 — the copy
      # here had drifted to 16 of the 26 steps while CLAUDE.md said "CI runs
      # the FULL chain"). Each step prints its own banner, so a failure still
      # names the gate. What is not in `check` and runs here: the package
      # installability proof and the build. Stage C of the Python smoke
      # (numpy/scipy) reports SKIP on this runner by design.
      - name: The gate chain (npm run check)
        run: npm run check

      # Phase 13 — "package installable" demonstrated, not asserted: npm pack
      # @essrt/physics, install the tarball into a clean project, prove the
      # installed copy resolves (ESM root + CJS subpath) and carries the
      # workspace model identity (COEFFICIENTS_HASH bit-equal).
      - name: Package installability (@essrt/physics)
        run: npm run test:package

      # The simulator must keep building while the packages are empty shells.
      - name: Build simulator
        run: npm run build

  # Separate job so a browser failure is never mistaken for a lint failure, and
  # so the Chromium download is cached independently of the fast checks above.
  browser:
    runs-on: ubuntu-latest
    # Belt-and-braces against infra hangs (the 6-hour default once burned
    # 2.5 h on an apt-mirror flake): the whole job comfortably fits here.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # SwiftShader supplies the GL context. `new THREE.WebGLRenderer(...)` sits
      # at module scope (src/script.js:12486), so the page cannot load without
      # one — jsdom is not an option.
      #
      # Cache HIT → skip the install entirely: `--with-deps` runs apt against
      # the Azure mirrors, which flake into multi-hour hangs (measured twice).
      # Cache MISS → install, but time-boxed to 15 min so a mirror hang fails
      # fast and retriably instead of burning the 6-hour job limit.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Build simulator
        run: npm run build

      # §5c — the tier that guards Phase 8, which dissolves src/script.js.
      # Proven to fail on a 1-ULP change.
      - name: Regression (script.js golden masters, headless)
        run: npm run test:snapshot

      # Deep-time performance gate (plan 02 §11 rounds 4-8: four ratio
      # regressions shipped ungated). RATIO thresholds — runner-speed
      # independent; fail-proven via ESSRT_PERF_TIGHTEN.
      - name: Performance regression (deep-time ratios, headless)
        run: npm run test:perf

      # THE Phase 6 acceptance gate — GREEN since B.3b and REQUIRED from here on.
      # It was red by design (21/84) while recomputeEpochAnchors mutated the
      # sidereal Fourier baseline; the baseline is a frozen const now and reset
      # restores the module-load seeds exactly (R16). f(Y) depends on Y alone.
      # A red run here is a regression of the Phase 6 exit criterion.
      - name: Referential transparency (Phase 6 exit criterion)
        run: npm run test:transparency

  # ── Deploy the simulator to GitHub Pages (3d.holisticuniverse.com) ────────
  # Runs ONLY on green main pushes — both gate jobs must pass first, so the
  # hosted scene is a pure function of a verified repo state. No stored
  # credentials: actions/deploy-pages uses GitHub's short-lived OIDC token
  # (the reason Pages beat FTP for a public repo). Source maps stay out of
  # the deploy; textures/input JSONs load via the simulator's GitHub-raw
  # fallback exactly as they always have.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build simulator
        run: npm run build
      - name: Strip source maps + set custom domain
        run: |
          find dist -name "*.map" -delete
          echo "3d.holisticuniverse.com" > dist/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
